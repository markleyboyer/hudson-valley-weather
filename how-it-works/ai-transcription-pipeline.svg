<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 960" width="1600" height="960" font-family="Georgia, 'Times New Roman', serif">
  <title>How the AI transcription works</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b5e45"/>
    </marker>
    <style>
      .title { font-size: 40px; fill: #2c2416; }
      .subtitle { font-size: 21px; fill: #6b5e45; }
      .step { font-size: 15px; fill: #8a7a5c; letter-spacing: 2px; }
      .head { font-size: 25px; fill: #2c2416; font-weight: bold; }
      .body { font-size: 18px; fill: #3d3020; }
      .small { font-size: 16px; fill: #6b5e45; }
      .big { font-size: 34px; font-weight: bold; }
      .box { fill: #fffdf8; stroke: #c8bfa8; stroke-width: 2; }
      .flow { stroke: #6b5e45; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .mono { font-family: Consolas, 'Courier New', monospace; }
      .inv-step { font-size: 15px; fill: #c8bfa8; letter-spacing: 2px; }
      .inv-head { font-size: 25px; fill: #f5f0e8; font-weight: bold; }
      .inv-body { font-size: 18px; fill: #f5f0e8; }
      .inv-small { font-size: 16px; fill: #c8bfa8; }
    </style>
  </defs>

  <rect width="1600" height="960" fill="#f5f0e8"/>

  <text x="60" y="78" class="title">How the AI transcription works</text>
  <text x="60" y="116" class="subtitle">Handwritten academy weather reports become checked, research-ready data, and people only look where it matters.</text>

  <!-- Stage boxes: x = 60, 360, 660, 960, 1260 ; width 280 -->
  <!-- 1. Scan + survey -->
  <rect x="60" y="160" width="280" height="430" rx="14" class="box"/>
  <text x="84" y="196" class="step">STEP 1</text>
  <text x="84" y="230" class="head">Each page</text>
  <text x="84" y="258" class="head">is surveyed</text>
  <!-- miniature ledger page -->
  <g transform="translate(110,282)">
    <rect width="180" height="150" fill="#efe7d6" stroke="#b0a48a"/>
    <line x1="0" y1="24" x2="180" y2="24" stroke="#b0a48a"/>
    <g stroke="#cfc4ab">
      <line x1="0" y1="44" x2="180" y2="44"/><line x1="0" y1="64" x2="180" y2="64"/>
      <line x1="0" y1="84" x2="180" y2="84"/><line x1="0" y1="104" x2="180" y2="104"/>
      <line x1="0" y1="124" x2="180" y2="124"/>
      <line x1="30" y1="24" x2="30" y2="150"/><line x1="70" y1="24" x2="70" y2="150"/>
      <line x1="110" y1="24" x2="110" y2="150"/><line x1="145" y1="24" x2="145" y2="150"/>
    </g>
    <text x="8" y="17" font-size="12" fill="#6b5e45" font-style="italic">January 1833 · Albany</text>
    <g font-size="15" fill="#4a3c28" font-style="italic">
      <text x="10" y="40">1</text><text x="38" y="40">42</text><text x="78" y="40">49</text><text x="116" y="40">41</text>
      <text x="10" y="60">2</text><text x="38" y="60">31</text><text x="78" y="60">40</text><text x="116" y="60">32</text>
      <text x="10" y="80">3</text><text x="38" y="80">36</text><text x="78" y="80">44</text><text x="116" y="80">41</text>
    </g>
  </g>
  <text x="84" y="470" class="body">A quick AI pass reads</text>
  <text x="84" y="494" class="body">the page type, month,</text>
  <text x="84" y="518" class="body">year and orientation,</text>
  <text x="84" y="542" class="body">and matches pages</text>
  <text x="84" y="566" class="body">to months.</text>

  <!-- 2. Two readers -->
  <rect x="360" y="160" width="280" height="430" rx="14" class="box"/>
  <text x="384" y="196" class="step">STEP 2</text>
  <text x="384" y="230" class="head">Two independent</text>
  <text x="384" y="258" class="head">AI readers</text>
  <rect x="384" y="284" width="232" height="58" rx="8" fill="#e2ebf7" stroke="#2e5e9e" stroke-width="1.5"/>
  <text x="500" y="320" text-anchor="middle" class="body">Reader A (Claude)</text>
  <rect x="384" y="356" width="232" height="58" rx="8" fill="#e3f2e7" stroke="#2f7d4a" stroke-width="1.5"/>
  <text x="500" y="392" text-anchor="middle" class="body">Reader B (Gemini)</text>
  <text x="384" y="452" class="body">Each transcribes every</text>
  <text x="384" y="476" class="body">cell of the month: three</text>
  <text x="384" y="500" class="body">temperatures, mean, wind,</text>
  <text x="384" y="524" class="body">weather and rain.</text>
  <text x="384" y="560" class="small">About 95% of cells right</text>
  <text x="384" y="580" class="small">from either reader alone.</text>

  <!-- 3. Checks -->
  <rect x="660" y="160" width="280" height="430" rx="14" class="box"/>
  <text x="684" y="196" class="step">STEP 3</text>
  <text x="684" y="230" class="head">Automatic checks</text>
  <text x="684" y="270" class="body" font-weight="bold">Do the readers agree?</text>
  <text x="684" y="294" class="small">96% of cells; those are</text>
  <text x="684" y="314" class="small">98% correct.</text>
  <text x="684" y="352" class="body" font-weight="bold">Does the observer's</text>
  <text x="684" y="376" class="body" font-weight="bold">arithmetic balance?</text>
  <text x="684" y="400" class="small">Every daily mean was written</text>
  <text x="684" y="420" class="small">by hand. When it doesn't fit</text>
  <text x="684" y="440" class="small">the readings, the AI re-reads</text>
  <text x="684" y="460" class="small">just those cells.</text>
  <text x="684" y="498" class="body" font-weight="bold">Known confusions</text>
  <text x="684" y="522" class="small">Shared mistakes (an 8 drawn</text>
  <text x="684" y="542" class="small">like a 0) are swept for</text>
  <text x="684" y="562" class="small">and flagged.</text>

  <!-- 4. People -->
  <rect x="960" y="160" width="280" height="430" rx="14" class="box"/>
  <text x="984" y="196" class="step">STEP 4</text>
  <text x="984" y="230" class="head">People review</text>
  <text x="984" y="258" class="head">only the doubts</text>
  <!-- mini review card -->
  <g transform="translate(990,282)">
    <rect width="220" height="128" rx="8" fill="#fdf1dc" stroke="#c27c0e" stroke-width="1.5"/>
    <rect x="12" y="12" width="196" height="46" fill="#efe7d6" stroke="#b0a48a"/>
    <text x="40" y="44" font-size="26" fill="#4a3c28" font-style="italic">4</text>
    <text x="58" y="44" font-size="26" fill="#4a3c28" font-style="italic">θ</text>
    <rect x="34" y="18" width="52" height="34" fill="none" stroke="#c27c0e" stroke-width="2.5"/>
    <text x="104" y="42" font-size="15" fill="#6b5e45">mean 48.00</text>
    <rect x="12" y="72" width="94" height="42" rx="6" fill="#3d3020"/>
    <text x="59" y="100" text-anchor="middle" font-size="20" fill="#f5f0e8">[1] 48</text>
    <rect x="114" y="72" width="94" height="42" rx="6" fill="#fffdf8" stroke="#b0a48a"/>
    <text x="161" y="100" text-anchor="middle" font-size="20" fill="#3d3020">[2] 40</text>
  </g>
  <text x="984" y="452" class="body">The scan crop appears</text>
  <text x="984" y="476" class="body">beside each doubtful</text>
  <text x="984" y="500" class="body">value; one keystroke</text>
  <text x="984" y="524" class="body">picks the right reading.</text>
  <text x="984" y="560" class="small">About 3–4% of cells need</text>
  <text x="984" y="580" class="small">a person.</text>

  <!-- 5. Output -->
  <rect x="1260" y="160" width="280" height="430" rx="14" fill="#3d3020"/>
  <text x="1284" y="196" class="inv-step">STEP 5</text>
  <text x="1284" y="230" class="inv-head">Checked daily</text>
  <text x="1284" y="258" class="inv-head">climate data</text>
  <text x="1284" y="300" class="inv-body">Pre-industrial baseline</text>
  <text x="1284" y="324" class="inv-small">for the Hudson Valley</text>
  <text x="1284" y="364" class="inv-body">Phenology research</text>
  <text x="1284" y="388" class="inv-small">growing degree days, frost</text>
  <text x="1284" y="428" class="inv-body">Then-and-now comparison</text>
  <text x="1284" y="452" class="inv-small">with the NYS Mesonet</text>
  <text x="1284" y="492" class="inv-body">International climate</text>
  <text x="1284" y="516" class="inv-body">archives</text>
  <text x="1284" y="540" class="inv-small">open, standard formats</text>

  <!-- arrows between stages -->
  <path d="M342,375 L358,375" class="flow"/>
  <path d="M642,375 L658,375" class="flow"/>
  <path d="M942,375 L958,375" class="flow"/>
  <path d="M1242,375 L1258,375" class="flow"/>

  <!-- worked example band -->
  <rect x="60" y="630" width="1480" height="150" rx="14" fill="#fffdf8" stroke="#c8bfa8" stroke-width="2"/>
  <text x="90" y="672" class="head">Example: the observer's own arithmetic catches a misread digit</text>
  <text x="90" y="712" class="body">Albany, January 6, 1833. Both AI readers read the morning and evening temperatures as <tspan class="mono" font-weight="bold">40</tspan>; the observer wrote a daily mean of <tspan class="mono" font-weight="bold">48.00</tspan>.</text>
  <text x="90" y="742" class="body">The Albany formula — (morning + 2 × afternoon + 2 × evening + next morning) ÷ 6 — balances only if both readings are <tspan class="mono" font-weight="bold">48</tspan>.</text>
  <text x="90" y="768" class="small">This hand writes 8 as a 0 with a small hook. The check flags it; the scan confirms it; the hand-proofed record agrees.</text>

  <!-- footer facts -->
  <g>
    <text x="60" y="842" class="big" fill="#2e5e9e">263</text>
    <text x="60" y="872" class="small">hand-proofed Albany months</text>
    <text x="60" y="892" class="small">(1827–1849) used to measure accuracy</text>

    <text x="440" y="842" class="big" fill="#2f7d4a">157 of 158</text>
    <text x="440" y="872" class="small">automatic arithmetic fixes</text>
    <text x="440" y="892" class="small">matched the proofed record</text>

    <text x="820" y="842" class="big" fill="#c27c0e">3–4%</text>
    <text x="820" y="872" class="small">of cells sent to a person;</text>
    <text x="820" y="892" class="small">the rest are accepted</text>

    <text x="1200" y="842" class="big" fill="#3d3020">Cents</text>
    <text x="1200" y="872" class="small">per page in AI costs, so the</text>
    <text x="1200" y="892" class="small">whole archive is within reach</text>
  </g>
</svg>
